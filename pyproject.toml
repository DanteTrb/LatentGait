[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latentgait"
version = "0.2.0"
description = "Privacy-preserving replication workflow for latent gait-instability analyses"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pymc>=5", "arviz", "pytensor", "pyyaml", "patsy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
