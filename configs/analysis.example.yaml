# Copy OUTSIDE the checkout; record the local QC reference and acknowledge the prior source.
protocol_version: 3
seed: 42
qc_protocol_reference: null  # reference to a locally approved eligibility/trial-selection protocol
orientation:
  # Fixed outcome-independent conventions; feature/tie order is in docs/INPUT_SCHEMA.md.
  kinematics: [1, 1, 1] # positive projection on increased pelvic excursions
  rhythmicity: largest_absolute_loading_positive
  complexity: largest_absolute_loading_positive
orientation_rationale: >-
  Preserve the positive-excursion kinematics anchor; orient rhythmicity/complexity PC1
  by a positive largest absolute loading, breaking exact ties by schema order.
  This deterministic convention was available in archived notebook 09; the historical
  executed branch is not certified. No fall outcomes or saved participant scores are used.
measurement:
  # Source: original b3ecf65 notebook 05 cell 5, NOT fully specified in the final DOCX.
  anchor_sd: 0.1       # residual STANDARD DEVIATION; variance is 0.01
  loading_prior_sd: 1.0
  residual_prior_sd: 0.5
  acknowledge_archived_priors: false
# Confirmed in archived b3ecf65 notebook 02 cell 11; shared participant draws across domains.
bootstrap_scaling: refit # 500 primary resamples + separate 5000-resample numerical check
# Adopted final reconstruction choice; not certified as the historical Figure S1 rule.
cumulative_rule: central_90 # empirical weighted 5th/95th percentiles, no KDE
# Lower-tail90 is also reported as an explicitly secondary sensitivity.
sampling: {chains: 4, warmup: 3000, draws: 3000, target_accept: 0.95}
